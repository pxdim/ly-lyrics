# Railway Deployment Configuration
# Project ID: f3497a33-73e6-4a4b-bf8a-160ecf113384

[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"
  watchPaths = ["package.json", "next.config.ts"]

[deploy]
  healthcheckPath = "/api/trpc/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[[services]]
  name = "web"
  source = "."
  healthcheck_path = "/api/trpc/health"

  [[services.ports]]
    type = "HTTP"
    port = 3000
    handle = "web"

  [[services.env_vars]]
    key = "NODE_ENV"
    value = "production"

  [[services.env_vars]]
    key = "PORT"
    value = "3000"

[env]
  # Supabase
  NEXT_PUBLIC_SUPABASE_URL = "https://ylwtfaczffuzyaijhhqu.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
  SUPABASE_SERVICE_ROLE_KEY = "${SUPABASE_SERVICE_ROLE_KEY}"

  # Gemini API
  GEMINI_API_KEY = "${GEMINI_API_KEY}"

  # Railway
  RAILWAY_PUBLIC_URL = "${RAILWAY_PUBLIC_URL}"
  PORT = "3000"

  # Node
  NODE_ENV = "production"
