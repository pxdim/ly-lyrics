# Railway Deployment Configuration
# Project ID: 0b6e0369-b0c3-400e-a2d4-a2c6c3062887

[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"
  watchPaths = ["package.json", "next.config.ts"]

[deploy]
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[[services]]
  name = "web"
  source = "."
  healthcheck_path = "/api/health"

  [[services.ports]]
    type = "HTTP"
    port = 3000
    handle = "web"

  [[services.env_vars]]
    key = "NODE_ENV"
    value = "production"

  [[services.env_vars]]
    key = "PORT"
    value = "3000"

# Environment variables reference
# Set these in Railway Dashboard for security
[env]
  # Supabase (set in Railway Dashboard)
  NEXT_PUBLIC_SUPABASE_URL = "${{Supabase.NEXT_PUBLIC_SUPABASE_URL}}"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "${{Supabase.NEXT_PUBLIC_SUPABASE_ANON_KEY}}"
  SUPABASE_SERVICE_ROLE_KEY = "${{Supabase.SUPABASE_SERVICE_ROLE_KEY}}"

  # Gemini API (set in Railway Dashboard)
  GEMINI_API_KEY = "${{Gemini.GEMINI_API_KEY}}"

  # Railway
  RAILWAY_PUBLIC_URL = "${{Railway.PUBLIC_URL}}"
  PORT = "3000"

  # Node
  NODE_ENV = "production"
