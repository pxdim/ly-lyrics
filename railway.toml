# Railway Deployment Configuration
# LY Lyrics Display System - Self-hosted architecture

[build]
  builder = "NIXPACKS"
  buildCommand = "npm run build"
  watchPaths = ["package.json", "next.config.ts"]

[deploy]
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
  autoRollback = true

[[services]]
  name = "web"
  source = "."
  healthcheck_path = "/api/health"

  [[services.ports]]
    type = "HTTP"
    port = 3000
    handle = "web"

  [[services.env_vars]]
    key = "NODE_ENV"
    value = "production"

  [[services.env_vars]]
    key = "PORT"
    value = "3000"

# ==================== Plugins ====================

# PostgreSQL Plugin
[[plugins]]
  plugin = "postgresql"
  name = "postgres"
  options = { databaseName = "lyrics", isOpen = true }

# Redis Plugin
[[plugins]]
  plugin = "redis"
  name = "redis"
  options = { isOpen = true }

# ==================== Environment Variables ====================
# Set these in Railway Dashboard for security

[env]
  # Database (PostgreSQL)
  DATABASE_URL = "${{ Postgres.DATABASE_URL }}"

  # Redis
  REDIS_URL = "${{ Redis.REDIS_URL }}"
  REDIS_ENABLED = "true"

  # NextAuth.js
  NEXTAUTH_URL = "${{ RailwayPublic.Domain }}"
  NEXTAUTH_SECRET = "${{ secrets.NEXTAUTH_SECRET }}"
  NEXT_PUBLIC_APP_URL = "${{ RailwayPublic.Domain }}"

  # Application
  PORT = "3000"
  NODE_ENV = "production"

  # Optional: Gemini API
  GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"

# ==================== Scaling ====================

[[services.scale]]
  min = 1
  max = 1

# ==================== Monitoring ====================

[deploy.monitoring]
  enabled = true
