# CI Workflow - LY 歌詞顯示系統
# Go 後端與 Next.js 前端的持續整合工作流

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'package.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '執行 E2E 測試（需要完整後端環境）'
        required: false
        type: boolean
        default: false

jobs:
  # Go 後端檢查：構建、靜態分析、單元測試
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run all tests
        working-directory: backend
        run: go test ./... -v -short -count=1

      - name: Check test coverage
        working-directory: backend
        run: |
          go test ./... -short -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

  # Next.js 前端檢查：型別檢查、單元測試（含覆蓋率）、Lint、構建
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Frontend Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const rows = [
                '| Metric | Coverage |',
                '|--------|----------|',
                '| Lines | ' + c.lines.pct + '% |',
                '| Functions | ' + c.functions.pct + '% |',
                '| Branches | ' + c.branches.pct + '% |',
                '| Statements | ' + c.statements.pct + '% |',
              ];
              console.log(rows.join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> coverage-summary.json not found. Ensure vitest coverage is configured correctly." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # E2E 測試：需要 Go 後端 + Next.js + Redis/DB 完整環境
  # 僅在手動觸發（workflow_dispatch）且勾選 run_e2e 時執行
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [go-backend, frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test infrastructure
        run: npm run test:e2e:setup

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Teardown test infrastructure
        if: always()
        run: npm run test:e2e:teardown
