# CI Workflow - LY 歌詞顯示系統
# Go 後端與 Next.js 前端的持續整合工作流

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  # Go 後端檢查：構建、靜態分析、單元測試
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        run: go test ./... -v -short

  # Next.js 前端檢查：型別檢查、構建
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
